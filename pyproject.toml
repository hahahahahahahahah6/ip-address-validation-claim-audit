[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ip-address-validation-claim-audit"
version = "0.1.0"
description = "Offline documentation claim auditor for Python projects"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"

[project.scripts]
ip-address-validation-claim-audit = "ip_address_validation_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["ip_address_validation_claim_audit*", "tests"]
